name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"     # Mondays: re-check the locked libraries for newly published vulnerabilities

permissions:
  contents: read              # the tests only need to read the code

# Actions are pinned to exact commits (not tags, which can be moved). Dependabot keeps them current.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.14"}
          - {os: macos-latest, python: "3.12"}
          - {os: macos-latest, python: "3.14"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install exactly the locked libraries (every file checked against its checksum)
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps -e .
      - name: Embedded Postgres for the database tests (skipped where unavailable)
        run: python -m pip install pgserver || echo "pgserver unavailable; Postgres tests will be skipped"
      - run: ruff check .
      - run: pytest -q
      - run: python -m build --no-isolation
      - run: python -m demo
      - run: python -m demo.bench
      - run: python -m demo.stress --quick
      - name: Attack suite on the bundled templates
        run: |
          for t in support finance; do
            d="$RUNNER_TEMP/$t"
            mkdir -p "$d" && taskvault init --template $t --dir "$d"
            taskvault test --policy "$d/taskvault.yaml" --fixtures "$d/fixtures.yaml"
          done

  adapters:
    # The TypeScript, Go and Java adapters against a real `taskvault api` (simulated demo data).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          python -m pip install --require-hashes -r requirements/runtime.lock
          python -m pip install --no-deps -e .
      - name: TypeScript / JavaScript
        run: node --test adapters/typescript/test/api.test.js
      - name: Go
        working-directory: adapters/go
        run: test -z "$(gofmt -l .)" && go vet ./... && go test -race -count=1 ./...
      - name: Java
        run: |
          javac -encoding UTF-8 -Xlint:all -Werror -d build/java \
            adapters/java/src/io/github/agentpcodes/taskvault/TaskVault.java adapters/java/test/TaskVaultTest.java
          java -cp build/java TaskVaultTest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements/ci.lock
      - name: Known vulnerabilities in what taskvault installs
        run: pip-audit -r requirements/runtime.lock --require-hashes --disable-pip --strict
      - name: Known vulnerabilities in the test and build tools
        run: pip-audit -r requirements/ci.lock --require-hashes --disable-pip --strict
      - name: The locks match what pyproject.toml asks for
        run: |
          python - <<'EOF'
          import re, tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          wanted = {re.split(r"[<>=!~\[ ;]", d)[0].lower() for d in deps}
          locked = set(re.findall(r"^([a-z0-9_.-]+)==", open("requirements/runtime.lock").read(), re.M))
          missing = wanted - locked
          assert not missing, f"runtime.lock is missing {missing}: rerun the lock command in requirements/README.md"
          print("locks cover", sorted(wanted))
          EOF
