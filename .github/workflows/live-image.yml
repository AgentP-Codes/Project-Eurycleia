name: live-image

# Builds the live test's agent (deploy/live/Dockerfile) and publishes it as ghcr.io/<owner>/eurycleia-live,
# tagged with the commit and "latest". Azure pulls it from there. The image holds code only, never secrets.
on:
  push:
    branches: [main, v0.7]
    paths: ["deploy/live/**", "eurycleia/**", "taskvault/**", "demo/pricing.py", "demo/results.py",
            "requirements/runtime.lock", "pyproject.toml", ".github/workflows/live-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # publish to this repository's GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/eurycleia-live"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build -f deploy/live/Dockerfile -t "$image:$GITHUB_SHA" -t "$image:latest" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .
      - name: Check it starts
        run: docker run --rm -e TEST_INBOX=check.only@gmail.com "$IMAGE:$GITHUB_SHA" report
      - name: Publish
        # The public repository only builds and checks the image: the published one comes from the development
        # repository (or your own fork), which owns the package. GitHub compares these names ignoring case.
        if: github.repository != 'AgentP-Codes/Project-Eurycleia'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
