# Weekly pull requests when a locked library or a pinned GitHub Action has an update.
# Each one runs the full CI (tests + vulnerability check) before you merge it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
