[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eurycleia"
version = "0.6.0"
description = "A task-scoped data vault for AI agents: contain prompt injection by limiting what a hijacked agent can reach and where data can go."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "AgentP-Codes"}]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "cryptography>=49"]
keywords = ["ai-agents", "prompt-injection", "llm-security", "mcp", "data-vault", "pseudonymization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "psycopg[binary]>=3.1", "hypothesis>=6"]
aws = ["boto3>=1.34"]
# Claude, OpenAI, Ollama and Gemini need nothing extra (built-in HTTPS). These stay so old install commands work.
anthropic = []
openai = []
ollama = []
langchain = ["langchain-core>=1.0"]
crewai = ["crewai>=1.0"]
gemini = []
postgres = ["psycopg[binary]>=3.1"]
all = ["boto3>=1.34", "psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/AgentP-Codes/project-eurycleia"
Issues = "https://github.com/AgentP-Codes/project-eurycleia/issues"

[project.scripts]
eurycleia = "eurycleia.cli:main"
eury = "eurycleia.cli:main"
taskvault = "eurycleia.cli:main"        # the name before 0.6, so existing setups keep working

[tool.setuptools.packages.find]
include = ["eurycleia", "eurycleia.*", "taskvault"]   # every subpackage; taskvault: the old name, kept for 0.5 code

[tool.setuptools.package-data]
"eurycleia" = ["py.typed"]
"eurycleia.templates" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E741", "B023", "UP007", "UP045"]
